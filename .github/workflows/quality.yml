name: Website quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format the prerender script
        run: npx prettier --write scripts/prerender.mjs src/App.tsx src/main.tsx
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist
